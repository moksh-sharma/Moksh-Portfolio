[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Skip Next.js runtime when the site is still linked to @netlify/plugin-nextjs but this
  # repo is Vite (dist/ only). Remove the plugin in Netlify UI if this env ever stops working.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Vite static site (publish: dist). If builds still fail on the Next plugin, remove
# @netlify/plugin-nextjs: Site configuration → Integrations / Build plugins.

# Scroll-scrubbed background video: byte-range support is required for smooth seeking.
# Netlify serves matching files from dist/ before these rules; keep Asset Optimization
# disabled for this site (Site configuration → Build & deploy → Post processing).
[[headers]]
  for = "/videos/*"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp4"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA fallback: static files in dist/ (e.g. /videos/*, /assets/*) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
